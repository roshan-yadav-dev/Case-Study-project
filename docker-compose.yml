version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_erp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mini_erp_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/mini_erp_crm?schema=public"
      JWT_SECRET: "enterprise_erp_jwt_super_secret_key_2026"
      JWT_EXPIRES_IN: "1d"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5000/api"
    container_name: mini_erp_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
